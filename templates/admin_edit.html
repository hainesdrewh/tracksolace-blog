{% extends "base.html" %}
{% block title %}{{ 'Edit post' if post else 'New post' }} | tracksolace notes{% endblock %}
{% block content %}

<section class="admin-section">
  <div class="container container-narrow">
    <h1>{{ 'Edit post' if post else 'New post' }}</h1>
    <form method="post" class="admin-form" novalidate>
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ post['title'] if post else '' }}" required>
      </div>
      <div class="field">
        <label for="slug">Slug (optional, auto-generated from title if left blank)</label>
        <input type="text" id="slug" name="slug" value="{{ post['slug'] if post else '' }}">
      </div>
      <div class="field">
        <label for="excerpt">Excerpt (optional, shown on the notes list)</label>
        <input type="text" id="excerpt" name="excerpt" value="{{ post['excerpt'] if post else '' }}">
      </div>
      <div class="field">
        <label for="body_md">Body (Markdown)</label>
        <textarea id="body_md" name="body_md" rows="18" required>{{ post['body_md'] if post else '' }}</textarea>
      </div>
      <div class="field field-checkbox">
        <label><input type="checkbox" name="published" {% if post and post['published'] %}checked{% endif %}> Published (visible to everyone)</label>
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
  </div>
</section>

{% endblock %}
