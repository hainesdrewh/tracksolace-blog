<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}tracksolace notes{% endblock %}</title>
<meta name="description" content="{% block description %}Notes and thoughts, posted whenever there's something worth writing down.{% endblock %}">
<link rel="canonical" href="{{ site_url }}{{ request.path }}">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="alternate" type="application/rss+xml" title="tracksolace notes" href="{{ url_for('rss') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="site-header" id="site-header">
  <div class="container header-row">
    <a href="{{ url_for('index') }}" class="logo">tracksolace</a>
    <nav class="header-nav" aria-label="Primary">
      <a href="{{ url_for('index') }}">Notes</a>
      <a href="{{ url_for('rss') }}">RSS</a>
    </nav>
  </div>
</header>

<main id="main-content">
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="container">
      {% for message in messages %}
        <p class="flash-message" role="alert">{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container footer-row">
    <span>&copy; <span class="current-year">2026</span> tracksolace</span>
    <a href="{{ url_for('rss') }}">RSS feed</a>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
