{% extends "base.html" %}
{% block content %}

<section class="post-list-section">
  <div class="container">
    {% if posts %}
      <ul class="post-list">
        {% for post in posts %}
        <li class="post-list-item">
          <a href="{{ url_for('view_post', slug=post['slug']) }}" class="post-list-link">
            <span class="post-list-date">{{ post['created_at'][:10] }} &middot; {{ post['read_minutes'] }} min</span>
            <h2>{{ post['title'] }}</h2>
          </a>
        </li>
        {% endfor %}
      </ul>
    {% else %}
      <p class="empty-state">Nothing posted yet.</p>
    {% endif %}
  </div>
</section>

{% endblock %}
